<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="O gatilho do modo legado: o arquivo PERFIL.md">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff7b72"/></marker>
  </defs>
  <rect width="1000" height="330" rx="12" fill="#0d1117"/>
  <text x="36" y="40" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Camada modificadora, nao metodo novo</text>
  <text x="36" y="62" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#8b949e">Um arquivo decide se o rigor extra liga. A sequencia de fases nunca muda.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="380" y="92" width="240" height="52" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="500" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">docs/legado/PERFIL.md</text>
    <text x="500" y="134" text-anchor="middle" font-size="10.5" fill="#8b949e">o mapa que o projeto nunca teve</text>

    <path d="M440 144v34h-190v26" stroke="#8b949e" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
    <path d="M560 144v34h190v26" stroke="#ff7b72" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="316" y="172" text-anchor="end" font-size="11" fill="#8b949e">nao existe</text>
    <text x="686" y="172" font-size="11" fill="#ff7b72">existe</text>

    <rect x="90" y="204" width="320" height="94" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="90" y="204" width="320" height="4" rx="2" fill="#6e7681"/>
    <text x="110" y="232" font-size="13" font-weight="700" fill="#e6edf3">modo legado DESLIGADO</text>
    <text x="110" y="254" font-size="10.5" fill="#8b949e">sprintx (F1..F6) e runx (E1..E5) rodam</text>
    <text x="110" y="270" font-size="10.5" fill="#8b949e">exatamente como hoje. O legadox nao</text>
    <text x="110" y="286" font-size="10.5" fill="#8b949e">interfere em nada.</text>

    <rect x="590" y="204" width="320" height="94" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="590" y="204" width="320" height="4" rx="2" fill="#ff7b72"/>
    <text x="610" y="232" font-size="13" font-weight="700" fill="#e6edf3">modo legado ATIVO</text>
    <text x="610" y="254" font-size="10.5" fill="#8b949e">as mesmas fases, com mais rigor: o raio</text>
    <text x="610" y="270" font-size="10.5" fill="#8b949e">de impacto e calculado antes do plano e</text>
    <text x="610" y="286" font-size="10.5" fill="#8b949e">decide quais camadas ligam.</text>
  </g>
</svg>
